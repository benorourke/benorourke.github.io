baseURL = "https://benorourke.github.io/"
locale = "en-GB"
title = "Ben O'Rourke"
theme = "archie"
paginate = 10

[params]
  author = "Ben O'Rourke"
  description = "Engineering notes and recipes."
  math = false
  readme = true
  mode = "auto"  # auto, dark, or light

  [[params.social]]
    name = "GitHub"
    url = "https://github.com/benorourke"

[menu]
  [[menu.main]]
    name = "Engineering"
    url = "/engineering/"
    weight = 1
  [[menu.main]]
    name = "Recipes"
    url = "/recipes/"
    weight = 2
  [[menu.main]]
    name = "Search"
    url = "/search/"
    weight = 3

[taxonomies]
  cuisine = "cuisines"
  tag = "tags"

[outputs]
  home = ["HTML", "RSS"]
