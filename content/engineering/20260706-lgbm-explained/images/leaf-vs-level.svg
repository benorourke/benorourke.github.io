<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 390" font-family="monospace" font-size="12">
  <rect width="820" height="390" fill="#f9f9f9"/>

  <!-- === LEFT: Level-wise === -->
  <text x="200" y="24" text-anchor="middle" fill="#333" font-size="13" font-weight="bold">Level-wise (XGBoost default)</text>

  <!-- Edges -->
  <line x1="200" y1="72" x2="120" y2="132" stroke="#aaa" stroke-width="1.5"/>
  <line x1="200" y1="72" x2="280" y2="132" stroke="#aaa" stroke-width="1.5"/>
  <line x1="120" y1="152" x2="75"  y2="212" stroke="#aaa" stroke-width="1.5"/>
  <line x1="120" y1="152" x2="165" y2="212" stroke="#aaa" stroke-width="1.5"/>
  <line x1="280" y1="152" x2="235" y2="212" stroke="#aaa" stroke-width="1.5"/>
  <line x1="280" y1="152" x2="325" y2="212" stroke="#aaa" stroke-width="1.5"/>

  <!-- Root -->
  <circle cx="200" cy="55"  r="20" fill="#888"/>
  <text x="200" y="60"  text-anchor="middle" fill="white" font-weight="bold">R</text>

  <!-- Round 1 leaves: A, B — both split in round 1 -->
  <circle cx="120" cy="140" r="20" fill="#5b8dd9"/>
  <text x="120" y="136" text-anchor="middle" fill="white" font-size="10">split</text>
  <text x="120" y="148" text-anchor="middle" fill="white" font-size="10">① </text>
  <circle cx="280" cy="140" r="20" fill="#5b8dd9"/>
  <text x="280" y="136" text-anchor="middle" fill="white" font-size="10">split</text>
  <text x="280" y="148" text-anchor="middle" fill="white" font-size="10">①</text>

  <!-- Round 2 leaves: C, D, E, F — all split in round 2 -->
  <circle cx="75"  cy="225" r="20" fill="#e8a24a"/>
  <text x="75"  y="221" text-anchor="middle" fill="white" font-size="10">split</text>
  <text x="75"  y="233" text-anchor="middle" fill="white" font-size="10">②</text>
  <circle cx="165" cy="225" r="20" fill="#e8a24a"/>
  <text x="165" y="221" text-anchor="middle" fill="white" font-size="10">split</text>
  <text x="165" y="233" text-anchor="middle" fill="white" font-size="10">②</text>
  <circle cx="235" cy="225" r="20" fill="#e8a24a"/>
  <text x="235" y="221" text-anchor="middle" fill="white" font-size="10">split</text>
  <text x="235" y="233" text-anchor="middle" fill="white" font-size="10">②</text>
  <circle cx="325" cy="225" r="20" fill="#e8a24a"/>
  <text x="325" y="221" text-anchor="middle" fill="white" font-size="10">split</text>
  <text x="325" y="233" text-anchor="middle" fill="white" font-size="10">②</text>

  <!-- Depth labels -->
  <text x="42" y="60"  fill="#999" font-size="10">depth 0</text>
  <text x="42" y="145" fill="#999" font-size="10">depth 1</text>
  <text x="42" y="230" fill="#999" font-size="10">depth 2</text>

  <!-- Note -->
  <text x="200" y="275" text-anchor="middle" fill="#555" font-size="11">All nodes at the same depth split together.</text>
  <text x="200" y="290" text-anchor="middle" fill="#555" font-size="11">Balanced, but splits wasted on low-gain leaves.</text>

  <!-- Legend -->
  <circle cx="80"  cy="330" r="8" fill="#5b8dd9"/>
  <text x="94"  y="335" fill="#333" font-size="11">round 1 splits</text>
  <circle cx="80"  cy="352" r="8" fill="#e8a24a"/>
  <text x="94"  y="357" fill="#333" font-size="11">round 2 splits</text>

  <!-- Divider -->
  <line x1="410" y1="15" x2="410" y2="375" stroke="#ccc" stroke-width="1" stroke-dasharray="5,4"/>

  <!-- === RIGHT: Leaf-wise === -->
  <text x="615" y="24" text-anchor="middle" fill="#333" font-size="13" font-weight="bold">Leaf-wise (LightGBM default)</text>

  <!-- Edges -->
  <line x1="615" y1="72" x2="535" y2="132" stroke="#aaa" stroke-width="1.5"/>
  <line x1="615" y1="72" x2="695" y2="132" stroke="#aaa" stroke-width="1.5"/>
  <line x1="535" y1="152" x2="490" y2="212" stroke="#aaa" stroke-width="1.5"/>
  <line x1="535" y1="152" x2="580" y2="212" stroke="#aaa" stroke-width="1.5"/>
  <line x1="490" y1="232" x2="455" y2="292" stroke="#aaa" stroke-width="1.5"/>
  <line x1="490" y1="232" x2="525" y2="292" stroke="#aaa" stroke-width="1.5"/>

  <!-- Root -->
  <circle cx="615" cy="55"  r="20" fill="#888"/>
  <text x="615" y="60"  text-anchor="middle" fill="white" font-weight="bold">R</text>

  <!-- Round 1: split R → A (high gain), B (low gain) -->
  <circle cx="535" cy="140" r="20" fill="#5b8dd9"/>
  <text x="535" y="136" text-anchor="middle" fill="white" font-size="10">split</text>
  <text x="535" y="148" text-anchor="middle" fill="white" font-size="10">①</text>
  <circle cx="695" cy="140" r="20" fill="#5b8dd9"/>
  <text x="695" y="136" text-anchor="middle" fill="white" font-size="10">split</text>
  <text x="695" y="148" text-anchor="middle" fill="white" font-size="10">①</text>

  <!-- Round 2: best leaf = A → split into C, D -->
  <circle cx="490" cy="225" r="20" fill="#e8a24a"/>
  <text x="490" y="221" text-anchor="middle" fill="white" font-size="10">split</text>
  <text x="490" y="233" text-anchor="middle" fill="white" font-size="10">②</text>
  <!-- B stays as leaf -->
  <circle cx="580" cy="225" r="20" fill="#ddd" stroke="#aaa" stroke-width="1"/>
  <text x="580" y="230" text-anchor="middle" fill="#888" font-size="10">leaf</text>

  <!-- Round 3: best leaf = C → split into E, F -->
  <circle cx="455" cy="305" r="20" fill="#5cb85c"/>
  <text x="455" y="301" text-anchor="middle" fill="white" font-size="10">split</text>
  <text x="455" y="313" text-anchor="middle" fill="white" font-size="10">③</text>
  <circle cx="525" cy="305" r="20" fill="#ddd" stroke="#aaa" stroke-width="1"/>
  <text x="525" y="310" text-anchor="middle" fill="#888" font-size="10">leaf</text>

  <!-- Depth labels -->
  <text x="757" y="60"  fill="#999" font-size="10">depth 0</text>
  <text x="757" y="145" fill="#999" font-size="10">depth 1</text>
  <text x="757" y="230" fill="#999" font-size="10">depth 2</text>
  <text x="757" y="310" fill="#999" font-size="10">depth 3</text>

  <!-- Note -->
  <text x="615" y="345" text-anchor="middle" fill="#555" font-size="11">Always splits the highest-gain leaf.</text>
  <text x="615" y="360" text-anchor="middle" fill="#555" font-size="11">Deeper, unbalanced — but lower loss per split.</text>

  <!-- Legend -->
  <circle cx="465" cy="378" r="8" fill="#5b8dd9"/>
  <text x="479" y="383" fill="#333" font-size="11">round 1</text>
  <circle cx="540" cy="378" r="8" fill="#e8a24a"/>
  <text x="554" y="383" fill="#333" font-size="11">round 2</text>
  <circle cx="610" cy="378" r="8" fill="#5cb85c"/>
  <text x="624" y="383" fill="#333" font-size="11">round 3</text>
  <circle cx="680" cy="378" r="8" fill="#ddd" stroke="#aaa" stroke-width="1"/>
  <text x="694" y="383" fill="#333" font-size="11">unsplit leaf</text>
</svg>
